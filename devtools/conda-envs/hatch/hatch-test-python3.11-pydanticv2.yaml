name: test
channels:
  - conda-forge/label/qcelemental_dev
  - conda-forge/label/qcengine_dev
  - conda-forge
  - nodefaults
dependencies:
  # Base
  - python=3.11
  - numpy
  - pydantic>=2.0
  - qcelemental>=0.50.0rc4
  - qcengine>=0.50.0rc2
  - msgpack-python

  # Quantum Chemistry Backends
  - psi4=1.10
  - dftd3-python

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - codecov
  - pip
  - pip:
      - qcmanybody>=0.7
