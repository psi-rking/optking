name: test
channels:
  - conda-forge/label/qcelemental_dev
  - conda-forge/label/qcengine_dev
  - conda-forge
  - nodefaults
dependencies:
  # Base
  - numpy
  - python=3.12
  - pydantic>=2.0
  - qcelemental >=0.50.0rc4
  - qcengine >=0.50.0rc2
  - msgpack-python

  # Testing & Chemistry Backends
  - pytest
  - pytest-cov
  - pytest-xdist
  - "psi4=1.11=*_3"
  - dftd3-python
  - codecov
  - pip
  - pip:
      - qcmanybody >=0.7
